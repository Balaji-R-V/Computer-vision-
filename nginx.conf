server {
    listen 80;
    server_name _; # Replace with your domain name or GCP External IP

    # Increase maximum upload file size for video uploads
    client_max_body_size 500M;

    # General reverse proxy for Aegis-OS Flask web server
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optimization for MJPEG video feeds & streaming endpoint (prevents buffer stall)
    location ~ ^/api/(video_feed|rtsp_feed)/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable response buffering for continuous live MJPEG stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Serve static assets directly for maximum performance
    location /static/ {
        proxy_pass http://127.0.0.1:5050/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
