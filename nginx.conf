server {
    listen 80;
    server_name aicv.devops-in22labs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aicv.devops-in22labs.com;

    ssl_certificate /etc/letsencrypt/live/aicv.devops-in22labs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicv.devops-in22labs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Increase maximum upload file size for video uploads
    client_max_body_size 500M;

    # General reverse proxy for Aegis-OS Flask web server
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Optimization for MJPEG video feeds & streaming endpoint (prevents buffer stall)
    location ~ ^/api/(video_feed|rtsp_feed)/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable response buffering for continuous live MJPEG stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Serve static assets directly for maximum performance
    location /static/ {
        proxy_pass http://127.0.0.1:5050/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
