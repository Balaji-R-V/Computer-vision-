services:
  aegis-cv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_cv_app
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - HOST=0.0.0.0
      - PORT=5050
      - AEGIS_RETENTION_DAYS=30
      - AEGIS_ENGINE_MODE=${AEGIS_ENGINE_MODE:-aws_rekognition}
      - AEGIS_SECRET_KEY=${AEGIS_SECRET_KEY:-oD_ofK9CrrFgcjiFpTvWv1LHepvQKs7re3zztnyPHvA=}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - AWS_REKOGNITION_COLLECTION=${AWS_REKOGNITION_COLLECTION:-aegis-rekognition-collection}
    volumes:
      - ./peoples.db:/app/peoples.db
      - ./static/uploads:/app/static/uploads
      - ./static/outputs:/app/static/outputs
      - ./logs:/app/logs
      - ./templates:/app/templates
      - ./static:/app/static
      - ./server.py:/app/server.py
      - ./aws_rekognition.py:/app/aws_rekognition.py
      - ./engine_manager.py:/app/engine_manager.py
      - ./detector.py:/app/detector.py
    # Enable GPU support on GCP VM if NVIDIA GPU drivers & nvidia-container-toolkit are installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
